services:
  db:
    image: postgres:16-alpine
    container_name: webhawk_cpp_db
    environment:
      POSTGRES_DB: webhawk_cpp
      POSTGRES_USER: webhawk
      POSTGRES_PASSWORD: webhawk_password
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhawk -d webhawk_cpp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: